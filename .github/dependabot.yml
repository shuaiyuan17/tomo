version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # TS 7 blocked: typescript-eslint peer range doesn't allow it yet (npm ERESOLVE).
      # Remove this once typescript-eslint supports TS 7, then upgrade deliberately.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # zod 4.5 changed the .default() marker the Agent SDK's bundled zod reads (#359).
      - dependency-name: "zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # React 19 requires react and react-dom to be the exact same version.
      # react is a runtime dep and react-dom a dev dep, so without this group
      # they land in separate PRs and the lone react bump breaks the web UI (#430).
      # Must stay above dev-dependencies: a dependency joins the first group it matches.
      react:
        patterns:
          - "react"
          - "react-dom"
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
