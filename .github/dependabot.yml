version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # TS 7 blocked: typescript-eslint peer range doesn't allow it yet (npm ERESOLVE).
      # Remove this once typescript-eslint supports TS 7, then upgrade deliberately.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # zod 4.5 changed the .default() marker the Agent SDK's bundled zod reads (#359).
      - dependency-name: "zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
